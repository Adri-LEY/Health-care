
services:

# ===== POSTGRESQL DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    environment:
      - POSTGRES_DB=healthcare_nexus
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_nexus"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - healthcare-network

# ===== DECLARATION DES VOLUMES ET RESEAUX =====
volumes:
  postgres-data:

networks:
  healthcare-network: