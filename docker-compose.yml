services:

  # ===== POSTGRESQL DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    environment:
      - POSTGRES_DB=healthcare_nexus
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_nexus"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - healthcare-network

  # ===== BACKEND (TON API) =====
  backend:
    build: ./backend # Docker va chercher le Dockerfile dans le dossier backend
    container_name: healthcare-backend
    restart: always
    ports:
      - "5000:5000" # Port de ton API
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare_nexus?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthcare-network

  # ===== FRONTEND (REACT) =====
  frontend:
    build: ./frontend # Docker va chercher le Dockerfile dans le dossier frontend
    container_name: healthcare-frontend
    restart: always
    ports:
      - "5173:5173" # Port Vite
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - healthcare-network

# ===== DECLARATION DES VOLUMES ET RESEAUX =====
volumes:
  postgres-data:

networks:
  healthcare-network: